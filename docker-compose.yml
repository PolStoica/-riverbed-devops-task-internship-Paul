services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
    depends_on:
      - redis
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 2s
      retries: 3

  redis:
    image: redis:7-alpine
